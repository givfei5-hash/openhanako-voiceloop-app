name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: |
          node --check voiceloop/index.js
          node --check voiceloop/tools/speak.js

      - name: Launch acceptance (three stages, densities, dedupe, silence, degradation)
        run: node tests/_test_launch.mjs

      - name: Silence and inner-monologue filter
        run: node tests/_test_silence.mjs

      - name: Long-task cadence (all four densities)
        run: |
          node tests/_test_longtask.mjs tight
          node tests/_test_longtask.mjs standard
          node tests/_test_longtask.mjs sparse
          node tests/_test_longtask.mjs quiet

      - name: Style to closing length
        run: node tests/_test_verbosity.mjs

      - name: Python syntax
        run: python3 -m py_compile voiceloop/speak.py voiceloop/scripts/tts_server.py voiceloop/scripts/gen_ref_lively.py voiceloop/scripts/generate_refs.py
