name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: |
          node --check index.js
          node --check tools/speak.js

      - name: Launch acceptance (three stages, densities, dedupe, silence, degradation)
        run: node _test_launch.mjs

      - name: Silence and inner-monologue filter
        run: node _test_silence.mjs

      - name: Long-task cadence (all four densities)
        run: |
          node _test_longtask.mjs tight
          node _test_longtask.mjs standard
          node _test_longtask.mjs sparse
          node _test_longtask.mjs quiet

      - name: Style to closing length
        run: node _test_verbosity.mjs

      - name: Python syntax
        run: |
          python3 -m py_compile speak.py scripts/tts_server.py scripts/gen_ref_lively.py scripts/generate_refs.py
